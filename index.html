    <!--
RESPOSTA DA ATIVIDADE:

1. O que o Git diz sobre o index.html antes do git add?

O Git informa que o arquivo index.html foi modificado,
mas que as alterações ainda não foram adicionadas à staging area.

2. O que acontece ao executar git commit -m "teste"
sem executar git add depois de uma nova alteração?

O Git informa que não há alterações adicionadas para o commit.
A mensagem indica que é necessário executar git add para colocar
as alterações na staging area antes de realizar o commit.
-->

<!--PS C:\Users\lanas\meu-portifolio> git commit -m "teste"
On branch master
Changes not staged for commit:
  (use "git add <file>..." to update what will be committed)
  (use "git restore <file>..." to discard changes in working directory)
        modified:   index.html

no changes added to commit (use "git add" and/or "git commit -a")-->
